<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <title>Event Search</title>
  <style>
    /* small UX nicety */
    #event-list li { cursor: pointer; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="page-header">Event Search</h1>
    
    <form class="form-inline" id="search-form" onsubmit="return false;">
      <div class="form-group">
        <input type="text" id="search-box" class="form-control" placeholder="Search for events">
      </div>

      <div class="form-group">
        <select id="event-type" class="form-control">
          <option value="f3k" selected>F3K</option>
          <option value="f5j">F5J</option>
        </select>
      </div>

      <div class="form-group">
        <label for="country" class="sr-only">Country</label>
        <input list="countries" id="country" class="form-control" value="GB" aria-label="Country">
        <datalist id="countries">
          <option value="GB">UK</option>
          <option value="US">USA</option>
          <option value="PO">Poland</option>
          <option value="FR">France</option>
          <option value="TH">Thailand</option>
          <option value="SG">Singapore</option>
        </datalist>
      </div>

      <div class="form-group">
        <label for="date-from">From:</label>
        <input type="date" id="date-from" class="form-control">
      </div>

      <div class="form-group">
        <label for="date-to">To:</label>
        <input type="date" id="date-to" class="form-control">
      </div>

      <button id="search-btn" class="btn btn-primary">Search</button>
    </form>
    
    <h2>Events</h2>
    <ul id="event-list" class="list-group"></ul>

    <h3>Event Details</h3>
    <div id="event-details"></div>

    <h3>Saved Events (Offline)</h3>
    <ul id="saved-events-list" class="list-group"></ul>
  </div>

  <script>
    // Replace these with real credentials / base URL
    const baseUrl = "https://f3xvault.com/api.php";
    const login = "guest";
    const password = "Guest1234";

    // Will hold the raw event JSON (the event object) to POST to /load_event
    let lastEventJson = null;

    function formatDate(date) {
      return date.toISOString().split("T")[0];
    }

    
    // Cookie helper functions
    function setCookie(name, value, days = 30) {
      const expires = new Date();
      expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = `${name}=${encodeURIComponent(JSON.stringify(value))};expires=${expires.toUTCString()};path=/`;
    }

    function getCookie(name) {
      const nameEQ = name + "=";
      const ca = document.cookie.split(';');
      for (let i = 0; i < ca.length; i++) {
        let c = ca[i];
        while (c.charAt(0) === ' ') c = c.substring(1, c.length);
        if (c.indexOf(nameEQ) === 0) {
          try {
            return JSON.parse(decodeURIComponent(c.substring(nameEQ.length, c.length)));
          } catch (e) {
            return null;
          }
        }
      }
      return null;
    }

    function saveFormData() {
      const formData = {
        searchBox: document.getElementById("search-box").value,
        eventType: document.getElementById("event-type").value,
        country: document.getElementById("country").value,
        dateFrom: document.getElementById("date-from").value,
        dateTo: document.getElementById("date-to").value
      };
      setCookie('eventSearchForm', formData);
    }

    // ---- Offline saved-event storage (localStorage) ----
    const SAVED_EVENTS_KEY = 'f3k_saved_events_v1';

    function getSavedEvents() {
      try {
        const raw = localStorage.getItem(SAVED_EVENTS_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.error("Error reading saved events:", e);
        return [];
      }
    }

    function setSavedEvents(list) {
      try {
        localStorage.setItem(SAVED_EVENTS_KEY, JSON.stringify(list));
      } catch (e) {
        console.error("Error saving events:", e);
        alert("Could not save event for offline use: " + e.message);
      }
    }

    function saveEventOffline(eventJson) {
      if (!eventJson) {
        alert("No event JSON available to save.");
        return;
      }
      const details = (eventJson && eventJson.event) ? eventJson.event : eventJson;
      const record = {
        event_id: details.event_id || details.id,
        event_name: details.event_name || details.name || "Unnamed event",
        event_type_code: details.event_type_code || "",
        country_code: details.country_code || "",
        start_date: details.start_date || "",
        end_date: details.end_date || "",
        saved_at: new Date().toISOString(),
        json: eventJson
      };
      const list = getSavedEvents().filter(e => e.event_id !== record.event_id);
      list.unshift(record);
      setSavedEvents(list);
      renderSavedEventsList();
    }

    function deleteSavedEvent(event_id) {
      if (!window.confirm("Delete this saved event?")) return;
      const list = getSavedEvents().filter(e => e.event_id !== event_id);
      setSavedEvents(list);
      renderSavedEventsList();
    }

    async function loadSavedEvent(event_id) {
      const record = getSavedEvents().find(e => e.event_id === event_id);
      if (!record) {
        alert("Saved event not found.");
        return;
      }
      try {
        const res = await fetch("/load_event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(record.json)
        });
        if (res.redirected) {
          window.location.href = res.url;
          return;
        }
      } catch (err) {
        alert("Error loading saved event: " + err.message);
      }
    }

    function renderSavedEventsList() {
      const list = document.getElementById("saved-events-list");
      list.innerHTML = "";
      const savedEvents = getSavedEvents();
      if (savedEvents.length === 0) {
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.textContent = "No saved events";
        list.appendChild(li);
        return;
      }
      savedEvents.forEach(record => {
        const li = document.createElement("li");
        li.className = "list-group-item";

        const info = document.createElement("span");
        const savedDate = new Date(record.saved_at);
        info.textContent = `${record.event_name} (${record.event_id}) — ${record.country_code} ${record.event_type_code} — saved ${savedDate.toLocaleString()}`;
        li.appendChild(info);

        const btnGroup = document.createElement("div");
        btnGroup.className = "btn-group pull-right";

        const loadBtn = document.createElement("button");
        loadBtn.className = "btn btn-success btn-xs";
        loadBtn.textContent = "Load";
        loadBtn.onclick = () => loadSavedEvent(record.event_id);
        btnGroup.appendChild(loadBtn);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn btn-danger btn-xs";
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = () => deleteSavedEvent(record.event_id);
        btnGroup.appendChild(deleteBtn);

        li.appendChild(btnGroup);
        list.appendChild(li);
      });
    }

    function loadFormData() {
      const savedData = getCookie('eventSearchForm');
      if (savedData) {
        document.getElementById("search-box").value = savedData.searchBox || "";
        document.getElementById("event-type").value = savedData.eventType || "f3k";
        document.getElementById("country").value = savedData.country || "GB";
        document.getElementById("date-from").value = savedData.dateFrom || "";
        document.getElementById("date-to").value = savedData.dateTo || "";
      } else {
        // Fallback to defaults if no cookie
        const defaults = getDefaultDateRange();
        document.getElementById("date-from").value = defaults.date_from;
        document.getElementById("date-to").value = defaults.date_to;
      }
    }

    function formatDate(date) {
      return date.toISOString().split("T")[0];
    }

    function getDefaultDateRange() {
      const now = new Date();
      const dateFrom = new Date(now);
      dateFrom.setMonth(dateFrom.getMonth() - 1);
      const dateTo = new Date(now);
      dateTo.setDate(dateTo.getDate() + 14);
      return { date_from: formatDate(dateFrom), date_to: formatDate(dateTo) };
    }
    function buildQuery(params) {
      return new URLSearchParams(params).toString();
    }

    async function apiRequest(baseUrl, login, password, func, extraParams = {}) {
      const params = {
        login,
        password,
        function: func,
        output_format: "json",
        ...extraParams,
        // Cache-busting: guarantees a unique URL per call so browser/proxy
        // HTTP caches can't return a stale response for repeated requests
        // (e.g. re-selecting the same event_id).
        _: Date.now(),
      };
      const url = `${baseUrl}?${buildQuery(params)}`;
      // "no-store" tells the browser to bypass its HTTP cache entirely for
      // this request, rather than relying on the API's cache headers.
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`API error: ${response.status}`);
      }
      return await response.json();
    }

    // Use "searchEvents" as the function name sent to the API
    async function searchEvents(baseUrl, login, password, {
      string,
      event_type_code = "f3k",
      country = "GB",
      date_from,
      date_to,
    } = {}) {
      if (!string || typeof string !== "string") {
        string = "";
      }
      const allowedTypes = ["f3k", "f5j"];
      if (!allowedTypes.includes(event_type_code)) {
        throw new Error(`Invalid event_type_code. Must be one of: ${allowedTypes.join(", ")}`);
      }
      const defaults = getDefaultDateRange();
      return apiRequest(baseUrl, login, password, "searchEvents", {
        string,
        event_type_code,
        country,
        date_from: date_from || defaults.date_from,
        date_to: date_to || defaults.date_to,
      });
    }

    async function getEventInfoFull(baseUrl, login, password, event_id) {
      if (!event_id) throw new Error("Parameter 'event_id' is required.");
      return apiRequest(baseUrl, login, password, "getEventInfoFull", { event_id });
    }

    async function populateEvents(searchString = "") {
      try {
        const eventType = document.getElementById("event-type").value;
        const country = document.getElementById("country").value;
        const dateFrom = document.getElementById("date-from").value;
        const dateTo = document.getElementById("date-to").value;

        const result = await searchEvents(baseUrl, login, password, {
          string: searchString,
          event_type_code: eventType,
          country: country,
          date_from: dateFrom,
          date_to: dateTo,
        });

        const events = result.events || [];
        const list = document.getElementById("event-list");
        list.innerHTML = "";
        events.forEach(ev => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.textContent = ev.event_name || ev.name || "Unnamed event";
          li.dataset.eventId = ev.event_id;
          li.onclick = async () => {
            try {
              const detailsResp = await getEventInfoFull(baseUrl, login, password, ev.event_id);
              // per your note: the useful data is in detailsResp.event
              const eventObj = (detailsResp && detailsResp.event) ? detailsResp.event : detailsResp;
              lastEventJson = detailsResp;           // store the raw event object for POST
              renderEventDetails(eventObj);      // pass details.event into renderer
            } catch (err) {
              console.error(err);
              alert("Error fetching event details: " + err.message);
            }
          };
          list.appendChild(li);
        });
      } catch (err) {
        console.error(err);
        alert("Error fetching events: " + err.message);
      }
    }

function renderEventDetails(details) {
  const container = document.getElementById("event-details");
  container.innerHTML = "";

  if (!details || typeof details !== "object") {
    container.textContent = "No details available.";
    return;
  }

  const panel = document.createElement("div");
  panel.className = "panel panel-info";

  // Panel heading
  const heading = document.createElement("div");
  heading.className = "panel-heading";
  heading.textContent = details.event_name || details.name || "Event Details";
  panel.appendChild(heading);

  // Panel body with two columns
  const body = document.createElement("div");
  body.className = "panel-body row";

  // Left column: main event info
  const leftCol = document.createElement("div");
  leftCol.className = "col-md-6";
  leftCol.innerHTML = `
    <p><strong>ID:</strong> ${details.event_id || details.id || "N/A"}</p>
    <p><strong>Location:</strong> ${details.location_name || "N/A"}, ${details.country_code || "N/A"}</p>
    <p><strong>From:</strong> ${details.start_date || "N/A"}</p>
    <p><strong>To:</strong> ${details.end_date || "N/A"}</p>
  `;

  // Right column: Pilots list
  const rightCol = document.createElement("div");
  rightCol.className = "col-md-6";

  if (Array.isArray(details.pilots) && details.pilots.length > 0) {
    let pilotsHtml = `<p><strong>Pilots:</strong></p><ul class="list-group">`;
    details.pilots.forEach(pilot => {
      pilotsHtml += `<li class="list-group-item">${pilot.pilot_first_name || ""} ${pilot.pilot_last_name || ""}</li>`;
    });
    pilotsHtml += `</ul>`;
    rightCol.innerHTML = pilotsHtml;
  } else {
    rightCol.innerHTML = `<p><strong>Pilots:</strong> None</p>`;
  }

  body.appendChild(leftCol);
  body.appendChild(rightCol);
  panel.appendChild(body);

  // Panel footer with Load Event button
  const footer = document.createElement("div");
  footer.className = "panel-footer";

  const loadBtn = document.createElement("button");
  loadBtn.className = "btn btn-success";
  loadBtn.textContent = "Load Event";
  loadBtn.onclick = async () => {
    if (!lastEventJson) {
      alert("No event JSON available to send.");
      return;
    }
    try {
      const res = await fetch("/load_event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(lastEventJson)
        
      });
      //console.log("Redirecting to:", res.url);
      if (res.redirected) {
        console.log("Redirecting to:", res.url);
        window.location.href = res.url; // follow the redirect
        return;
      }
    } catch (err) {
      alert("Error sending event: " + err.message);
    }
  };

  const saveOfflineBtn = document.createElement("button");
  saveOfflineBtn.className = "btn btn-default";
  saveOfflineBtn.style.marginLeft = "8px";
  saveOfflineBtn.textContent = "Save for Offline";
  saveOfflineBtn.onclick = () => saveEventOffline(lastEventJson);

  footer.appendChild(loadBtn);
  footer.appendChild(saveOfflineBtn);
  panel.appendChild(footer);

  container.appendChild(panel);
}


    // wire up search button
    document.getElementById("search-btn").addEventListener("click", () => {
      saveFormData();
      const query = document.getElementById("search-box").value.trim();
      populateEvents(query);
    });

    // initialize date pickers and initial load
    window.onload = () => {
      loadFormData();
      populateEvents();
      renderSavedEventsList();
    };
  </script>
</body>
</html>
